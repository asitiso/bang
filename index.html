<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
  <meta name="theme-color" content="#0b0f14" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>시간의 방 — 모바일 방탈출</title>
  <style>
:root{
  --bg:#080b10;--panel:#111822;--ink:#f2f4f7;--muted:#9aa6b2;--accent:#ffcb66;
  --danger:#ff435c;--cyan:#6ee7ff;--safe:#7ef29a;--shadow:0 22px 60px rgba(0,0,0,.45);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif}
#app{width:100%;height:100%;min-height:100dvh;overflow:hidden}
button,textarea{font:inherit}
button{cursor:pointer}
.hidden{display:none!important}
.screen{width:100%;height:100%;min-height:100dvh;position:relative}
.start-screen{display:grid;place-items:center;padding:24px;background:
  radial-gradient(circle at 20% 20%,rgba(99,163,255,.18),transparent 35%),
  radial-gradient(circle at 80% 75%,rgba(255,162,65,.16),transparent 38%),
  linear-gradient(135deg,#0d1118,#05070a 65%)}
.start-card{width:min(92vw,460px);padding:30px;border:1px solid rgba(255,255,255,.12);border-radius:26px;background:rgba(12,17,24,.82);box-shadow:var(--shadow);backdrop-filter:blur(16px)}
.eyebrow{letter-spacing:.28em;font-size:11px;color:var(--cyan);font-weight:800}.start-card h1{font-size:42px;margin:10px 0 12px}.start-card p{line-height:1.65;color:#c7d0d8}.start-rules{display:grid;gap:9px;margin:20px 0;color:#d5dde4;font-size:14px}.primary-btn{width:100%;border:0;border-radius:15px;padding:16px 18px;background:linear-gradient(135deg,#ffd879,#ff9e3d);color:#17100a;font-weight:900;font-size:18px;box-shadow:0 10px 35px rgba(255,173,61,.25)}.start-card small{display:block;margin-top:12px;color:#77838e;line-height:1.45}

.game-screen{background:#070a0e;height:100dvh;min-height:100dvh;overflow:hidden}.hud{position:fixed;z-index:50;top:0;left:0;right:0;height:78px;padding:calc(10px + env(safe-area-inset-top)) 12px 8px;display:grid;grid-template-columns:minmax(0,1fr) auto 44px;gap:10px;align-items:center;background:linear-gradient(to bottom,rgba(5,8,12,.96),rgba(5,8,12,.75),transparent)}
.stage-pill{min-width:0}.stage-pill span{display:block;font-size:10px;color:var(--cyan);letter-spacing:.16em}.stage-pill b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14px;margin-top:2px}.timer{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-weight:900;font-size:27px;letter-spacing:.04em;padding:7px 10px;border-radius:11px;color:#fff;background:#121923;border:1px solid rgba(255,255,255,.12);box-shadow:inset 0 0 18px rgba(110,231,255,.05)}.timer.warning{color:#ffe47b;box-shadow:0 0 20px rgba(255,211,97,.22)}.timer.danger{color:#ff5c70;animation:pulse .6s infinite alternate;box-shadow:0 0 24px rgba(255,67,92,.28)}
.icon-btn{width:42px;height:42px;border:1px solid rgba(255,255,255,.12);border-radius:12px;background:#141b24;color:#fff;font-size:20px}.progress{position:fixed;z-index:52;top:calc(70px + env(safe-area-inset-top));left:12px;right:12px;height:3px;display:flex;gap:4px}.progress i{display:block;flex:1;height:100%;border-radius:99px;background:rgba(255,255,255,.14)}.progress i.done{background:var(--safe)}.progress i.current{background:var(--accent)}
.viewport{position:absolute;inset:0;height:100%;min-height:100dvh;overflow-x:auto;overflow-y:hidden;touch-action:pan-x;scrollbar-width:none;overscroll-behavior-x:contain;cursor:grab}.viewport::-webkit-scrollbar{display:none}.viewport.dragging{cursor:grabbing}.room{height:100%;width:1900px;min-width:1900px;position:relative;overflow:hidden;background:#18202b;transition:filter .25s}
.room::before{content:"";position:absolute;inset:0;background:linear-gradient(to bottom,rgba(0,0,0,.02),rgba(0,0,0,.14) 62%,rgba(0,0,0,.55));pointer-events:none;z-index:2}
.room::after{content:"";position:absolute;left:0;right:0;bottom:0;height:24%;background:repeating-linear-gradient(90deg,rgba(255,255,255,.025) 0 2px,transparent 2px 120px),linear-gradient(#1a1d21,#090b0d);clip-path:polygon(0 38%,100% 0,100% 100%,0 100%);z-index:1}

.room-theme-1{background:radial-gradient(circle at 20% 25%,rgba(245,190,105,.18),transparent 25%),linear-gradient(90deg,#17202a,#263341 48%,#12171e)}
.room-theme-2{background:radial-gradient(circle at 50% 18%,rgba(121,206,255,.12),transparent 30%),linear-gradient(90deg,#131d22,#22323c,#0d1418)}
.room-theme-3{background:radial-gradient(circle at 70% 20%,rgba(255,95,95,.11),transparent 26%),linear-gradient(90deg,#1a1520,#312339,#15111a)}
.room-theme-4{background:radial-gradient(circle at 42% 18%,rgba(145,255,201,.10),transparent 29%),linear-gradient(90deg,#111c1a,#20322f,#0e1515)}
.room-theme-5{background:radial-gradient(circle at 30% 16%,rgba(255,213,111,.10),transparent 28%),linear-gradient(90deg,#171711,#2e2b1c,#12120e)}
.room-theme-6{background:radial-gradient(circle at 70% 18%,rgba(93,146,255,.13),transparent 25%),linear-gradient(90deg,#0d1320,#1e2b46,#090e17)}
.room-theme-7{background:radial-gradient(circle at 45% 22%,rgba(224,133,255,.12),transparent 28%),linear-gradient(90deg,#18101d,#30203a,#110b16)}
.room-theme-8{background:radial-gradient(circle at 30% 18%,rgba(84,255,227,.10),transparent 28%),linear-gradient(90deg,#0d1a1a,#15322f,#091210)}
.room-theme-9{background:radial-gradient(circle at 75% 15%,rgba(255,130,79,.10),transparent 30%),linear-gradient(90deg,#1b1310,#3a261e,#130d0b)}
.room-theme-10{background:radial-gradient(circle at 50% 25%,rgba(255,58,91,.11),transparent 30%),linear-gradient(90deg,#100d14,#2b1a2b,#0b0910)}

.wall-label{position:absolute;z-index:4;top:120px;left:42px;font-size:12px;letter-spacing:.25em;color:rgba(255,255,255,.45)}.room-title{position:absolute;z-index:4;top:142px;left:42px;font-size:36px;font-weight:900;text-shadow:0 7px 25px rgba(0,0,0,.5)}
.clue{position:absolute;z-index:5;width:230px;min-height:220px;border:1px solid rgba(255,255,255,.14);border-radius:12px;background:linear-gradient(160deg,rgba(236,230,213,.95),rgba(181,171,150,.94));color:#171717;box-shadow:0 20px 55px rgba(0,0,0,.4);padding:14px;transform:rotate(var(--r,0deg));transition:transform .18s,box-shadow .18s}.clue:active{transform:scale(.98) rotate(var(--r,0deg))}.clue .tag{font-size:10px;letter-spacing:.15em;font-weight:900;color:#6e6558}.clue h3{font-size:14px;margin:5px 0 10px}.clue-art{height:145px;border-radius:8px;background:#e8e2d3;display:grid;place-items:center;overflow:hidden;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)}.clue-art.dark{background:#171a1e;color:#f8f1df}.clue-art.blueprint{background-color:#15314a;color:#e7f5ff;background-image:linear-gradient(rgba(255,255,255,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.06) 1px,transparent 1px);background-size:18px 18px}.clue-art.redpaper{background:#5d1820;color:#ffe8cf}.clue-art .big{font:800 34px/1 ui-monospace,monospace;letter-spacing:.08em}.clue-art .mid{font:800 22px/1.35 ui-monospace,monospace}.clue-art .tiny{font:700 14px/1.5 ui-monospace,monospace}.dot-grid{display:grid;grid-template-columns:repeat(3,20px);gap:12px}.dot-grid b{width:20px;height:20px;border-radius:50%;border:2px solid currentColor}.dot-grid b.on{background:currentColor}.shape-row{display:flex;align-items:center;gap:14px;font-size:36px}.binary{display:grid;grid-template-columns:repeat(4,28px);gap:9px}.binary i{display:block;width:28px;height:28px;border-radius:50%;background:#26303a;border:2px solid #74818c}.binary i.on{background:#7affb0;box-shadow:0 0 12px #62ff9e}.symbol-grid{display:grid;grid-template-columns:repeat(3,40px);gap:10px;font-size:28px;text-align:center}.paper-lines{width:80%;height:70%;background:repeating-linear-gradient(to bottom,transparent 0 16px,rgba(0,0,0,.18) 17px 18px);position:relative}.paper-lines::before{content:"◇ ○ △ □";position:absolute;left:10px;top:13px;font-weight:900;letter-spacing:.28em}.paper-lines::after{content:"△ □ ○ ◇";position:absolute;left:10px;top:48px;font-weight:900;letter-spacing:.28em}

.prop{position:absolute;z-index:3;filter:drop-shadow(0 20px 20px rgba(0,0,0,.35))}.desk{left:320px;bottom:115px;width:460px;height:170px;border-radius:5px 5px 0 0;background:linear-gradient(#6b4b30,#3a281d);box-shadow:0 18px 0 #251a13}.shelf{left:870px;bottom:115px;width:360px;height:500px;border:20px solid #3a2a21;background:repeating-linear-gradient(to bottom,#271c16 0 98px,#4b3629 99px 112px)}.lamp{left:620px;top:180px;width:110px;height:110px;border-radius:55px 55px 20px 20px;background:radial-gradient(circle,#ffe7a9,#c77f2e 64%,#593517);box-shadow:0 0 70px rgba(255,196,93,.34)}.window{left:1260px;top:150px;width:300px;height:360px;border:17px solid #281f1b;background:linear-gradient(#08192d,#153656 55%,#533b4e);box-shadow:inset 0 0 0 7px #15110f}.window::before{content:"";position:absolute;width:80px;height:80px;border-radius:50%;background:#eee0b5;right:30px;top:34px;box-shadow:0 0 25px #eee0b5}.window::after{content:"";position:absolute;left:50%;top:0;bottom:0;width:10px;background:#211917;box-shadow:-140px 175px 0 -3px #211917}

.exit-zone{position:absolute;z-index:6;right:72px;top:120px;width:280px;height:560px}.door{position:absolute;inset:0;background:linear-gradient(90deg,#3a2c25,#5d4638 42%,#2f241f);border:9px solid #201916;box-shadow:0 20px 55px rgba(0,0,0,.55),inset 0 0 0 4px rgba(255,255,255,.035)}.door::before{content:"EXIT";position:absolute;top:36px;left:0;right:0;text-align:center;letter-spacing:.4em;font-size:11px;color:#c8bda7}.door::after{content:"";position:absolute;right:26px;top:280px;width:35px;height:8px;border-radius:6px;background:#c2ad86;box-shadow:0 0 0 5px #24211e}.keypad-preview{position:absolute;left:56px;top:190px;width:126px;padding:12px 10px;border-radius:10px;background:#14181d;border:3px solid #32383e;box-shadow:0 8px 20px rgba(0,0,0,.45)}.keypad-preview .slots{height:26px;border-radius:4px;background:#050707;color:#7bffaf;display:grid;place-items:center;font:900 17px monospace;letter-spacing:.18em;margin-bottom:8px}.keypad-preview .keys{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}.keypad-preview .keys i{height:22px;border-radius:3px;background:#343b43;border:1px solid #4c555f}.door-cta{position:absolute;left:33px;right:33px;bottom:34px;padding:11px;border-radius:10px;background:rgba(0,0,0,.55);color:#fff;text-align:center;font-weight:800;font-size:13px}


.chain-banner{position:absolute;z-index:7;top:198px;left:42px;display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:12px;background:rgba(8,12,17,.82);border:1px solid rgba(255,216,121,.28);box-shadow:0 10px 28px rgba(0,0,0,.28);font-size:12px;color:#e9edf1;backdrop-filter:blur(10px)}
.chain-banner b{color:#ffd879;font:900 13px ui-monospace,monospace}
.clue.chain-locked{filter:grayscale(.95) brightness(.46);opacity:.72;cursor:not-allowed}
.clue.chain-locked::after{content:"🔒 앞 단서 해결 필요";position:absolute;inset:0;z-index:8;display:grid;place-items:center;border-radius:12px;background:rgba(8,10,13,.66);color:#f2f4f7;font-weight:900;font-size:14px;letter-spacing:.02em}
.clue.chain-current{box-shadow:0 0 0 2px rgba(255,216,121,.9),0 0 34px rgba(255,190,75,.28),0 20px 55px rgba(0,0,0,.4);animation:chainGlow 1.25s ease-in-out infinite alternate}
.clue.chain-solved{opacity:.82;box-shadow:0 0 0 2px rgba(126,242,154,.7),0 18px 42px rgba(0,0,0,.35)}
.clue.chain-solved::after{content:"✓ 해제";position:absolute;right:9px;top:9px;z-index:9;padding:5px 8px;border-radius:999px;background:#163624;color:#8effae;font-size:11px;font-weight:900}
.exit-zone.chain-locked{filter:grayscale(.75) brightness(.62)}
.exit-zone.chain-locked .keypad-preview{box-shadow:0 0 0 2px rgba(255,67,92,.2),0 8px 20px rgba(0,0,0,.45)}
.chain-solve{margin-top:16px;padding:14px;border-radius:14px;background:#0b1118;border:1px solid #2c3946}
.chain-solve-title{font-size:12px;color:#ffd879;font-weight:900;margin-bottom:9px}
.chain-solve-row{display:flex;gap:8px}
.chain-input{flex:1;min-width:0;height:52px;border-radius:12px;border:1px solid #405062;background:#05080b;color:#7bffaf;text-align:center;font:900 26px ui-monospace,monospace;outline:none}
.chain-input:focus{border-color:#ffd879;box-shadow:0 0 0 3px rgba(255,216,121,.12)}
.chain-submit{flex:none;border:0;border-radius:12px;padding:0 16px;background:linear-gradient(135deg,#ffd879,#ff9e3d);color:#191109;font-weight:900}
.chain-message{min-height:20px;margin-top:8px;color:#9da9b4;font-size:12px;line-height:1.45}
.chain-complete{margin-top:16px;padding:12px 14px;border-radius:12px;background:#0d2417;border:1px solid #28563a;color:#8effae;font-size:13px;font-weight:800}
.chain-toast{position:fixed;z-index:120;left:50%;top:112px;transform:translateX(-50%);max-width:min(90vw,420px);padding:11px 15px;border-radius:12px;background:#17120a;border:1px solid rgba(255,216,121,.35);color:#ffe2a2;box-shadow:0 12px 36px rgba(0,0,0,.45);font-weight:900;font-size:13px;text-align:center;pointer-events:none;animation:chainToast 1.5s forwards}
@keyframes chainGlow{from{filter:brightness(1)}to{filter:brightness(1.08)}}
@keyframes chainToast{0%{opacity:0;transform:translate(-50%,-8px)}12%,78%{opacity:1;transform:translate(-50%,0)}100%{opacity:0;transform:translate(-50%,-12px)}}
@media (min-width:900px){.chain-banner{left:72px}}



/* 1~10: 방별 공간 분위기 + 단서/클리어 반응 */
.room.standard-stage{--stdGlow:#ffd879}
.standard-room-fx{position:absolute;z-index:3;inset:0;pointer-events:none;overflow:hidden}
.standard-room-fx::before,.standard-room-fx::after{content:"";position:absolute;inset:0;pointer-events:none}
.standard-room-fx .fx-a,.standard-room-fx .fx-b,.standard-room-fx .fx-c,.standard-room-fx .fx-d{position:absolute;display:block;pointer-events:none}
.standard-stage.fx-clue-hit .standard-room-fx::after{animation:clueShock .62s ease-out}
.standard-stage.fx-room-clear .standard-room-fx::before{animation:roomClearWash .9s ease-out}
.standard-stage.fx-room-clear .room-title{animation:titleClear .7s ease-out}
.standard-stage.fx-room-clear .door{box-shadow:0 0 0 2px rgba(126,242,154,.5),0 0 50px rgba(126,242,154,.25),0 20px 55px rgba(0,0,0,.55),inset 0 0 0 4px rgba(255,255,255,.035)}
.standard-room-fx::after{background:radial-gradient(circle 150px at var(--fx-x,50%) var(--fx-y,50%),color-mix(in srgb,var(--stdGlow) 38%,transparent),transparent 72%);opacity:0}

/* 1 기억의 서재: 따뜻한 먼지와 오래된 램프 */
.standard-stage-1{--stdGlow:#ffc86c}
.standard-stage-1 .standard-room-fx::before{background:
  radial-gradient(circle at 34% 31%,rgba(255,209,126,.16),transparent 10%),
  radial-gradient(circle at 35% 31%,rgba(255,189,81,.08),transparent 24%);animation:lampBreath 3.8s ease-in-out infinite alternate}
.standard-stage-1 .fx-a{left:180px;top:170px;width:8px;height:8px;border-radius:50%;background:#ffd990;box-shadow:120px 84px 0 -2px #f7c679,260px -36px 0 -3px #ffdc9f,420px 70px 0 -2px #eebd70,610px -20px 0 -3px #ffe0a8,820px 115px 0 -2px #e4ac5f,1040px 25px 0 -3px #ffdda0,1220px 150px 0 -2px #f0bd72;opacity:.42;animation:dustDrift 8s linear infinite}

/* 2 뒤집힌 화실: 거울광 */
.standard-stage-2{--stdGlow:#9ddcff}
.standard-stage-2 .standard-room-fx::before{left:-35%;width:40%;background:linear-gradient(105deg,transparent 15%,rgba(202,235,255,.03) 25%,rgba(218,244,255,.2) 48%,rgba(202,235,255,.035) 70%,transparent 85%);transform:skewX(-12deg);animation:mirrorSweep 5.2s ease-in-out infinite}
.standard-stage-2 .fx-a{left:1280px;top:150px;width:280px;height:350px;border:1px solid rgba(190,230,255,.13);box-shadow:inset 0 0 45px rgba(170,222,255,.08),0 0 30px rgba(120,190,255,.06)}

/* 3 신호실: 붉은 신호 펄스 */
.standard-stage-3{--stdGlow:#ff6375}
.standard-stage-3 .standard-room-fx::before{background:repeating-linear-gradient(to bottom,transparent 0 68px,rgba(255,68,88,.035) 69px 70px)}
.standard-stage-3 .fx-a{left:0;right:0;top:220px;height:2px;background:linear-gradient(90deg,transparent,#ff5067,transparent);box-shadow:0 0 16px #ff3853;animation:signalScan 2.8s linear infinite}
.standard-stage-3 .fx-b{right:420px;top:125px;width:16px;height:16px;border-radius:50%;background:#4a161d;animation:redBeacon 1.15s ease-in-out infinite alternate}

/* 4 좌표의 방: 청록 격자 스캔 */
.standard-stage-4{--stdGlow:#8affc7}
.standard-stage-4 .standard-room-fx::before{background-image:linear-gradient(rgba(130,255,201,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(130,255,201,.035) 1px,transparent 1px);background-size:52px 52px;mask-image:linear-gradient(to bottom,transparent 8%,#000 35%,#000 70%,transparent 92%)}
.standard-stage-4 .fx-a{left:80px;right:80px;top:0;height:3px;background:linear-gradient(90deg,transparent,#86ffd2,transparent);box-shadow:0 0 22px rgba(110,255,201,.6);animation:gridSweep 3.4s linear infinite}

/* 5 문양 보관실: 금빛 문양 잔상 */
.standard-stage-5{--stdGlow:#ffe18a}
.standard-stage-5 .fx-a{left:360px;top:180px;font-size:58px;color:rgba(255,226,135,.11);text-shadow:360px 145px 0 rgba(255,226,135,.09),700px -40px 0 rgba(255,226,135,.08),980px 190px 0 rgba(255,226,135,.08);animation:motifFloat 5s ease-in-out infinite alternate}
.standard-stage-5 .fx-a::before{content:"✿"}
.standard-stage-5 .standard-room-fx::before{background:radial-gradient(circle at 55% 38%,rgba(255,213,111,.07),transparent 34%)}

/* 6 전산 기록실: CRT 스캔라인 */
.standard-stage-6{--stdGlow:#6fa8ff}
.standard-stage-6 .standard-room-fx::before{background:repeating-linear-gradient(to bottom,rgba(100,160,255,.025) 0 2px,transparent 2px 6px);animation:crtFlicker .16s steps(2) infinite}
.standard-stage-6 .fx-a{left:0;right:0;top:100px;height:70px;background:linear-gradient(to bottom,transparent,rgba(79,137,255,.07),transparent);animation:dataBand 3.2s linear infinite}
.standard-stage-6 .fx-b{right:390px;top:470px;color:rgba(116,171,255,.14);font:900 18px ui-monospace,monospace;letter-spacing:.35em;animation:binaryBlink 1.3s steps(2) infinite}
.standard-stage-6 .fx-b::before{content:"1011 0010 1110"}

/* 7 수학자의 작업실: 분필 수식 잔상 */
.standard-stage-7{--stdGlow:#e090ff}
.standard-stage-7 .fx-a{left:300px;top:170px;color:rgba(239,202,255,.1);font:900 44px Georgia,serif;transform:rotate(-7deg);animation:chalkHover 4.4s ease-in-out infinite alternate}
.standard-stage-7 .fx-a::before{content:"∑  π  √  ∞"}
.standard-stage-7 .fx-b{left:980px;top:390px;width:120px;height:120px;border:2px dashed rgba(224,144,255,.12);border-radius:50%;animation:mathOrbit 8s linear infinite}

/* 8 암호 인쇄소: 인쇄 롤러/초록 레이저 */
.standard-stage-8{--stdGlow:#67ffe0}
.standard-stage-8 .standard-room-fx::before{background:repeating-linear-gradient(90deg,transparent 0 94px,rgba(85,255,226,.026) 95px 96px)}
.standard-stage-8 .fx-a{left:0;right:0;top:300px;height:4px;background:linear-gradient(90deg,transparent,#58ffd9 20%,#58ffd9 80%,transparent);box-shadow:0 0 20px rgba(80,255,220,.5);animation:printScan 3s ease-in-out infinite}
.standard-stage-8 .fx-b{left:760px;bottom:105px;width:260px;height:38px;border-radius:22px;background:linear-gradient(#1e2a29,#07100e);box-shadow:inset 0 0 0 4px #263b36}

/* 9 관측소: 별빛과 관측 빔 */
.standard-stage-9{--stdGlow:#ff9f69}
.standard-stage-9 .standard-room-fx::before{background-image:radial-gradient(circle,#fff 0 1px,transparent 1.5px),radial-gradient(circle,#ffd6b7 0 1px,transparent 1.5px);background-size:140px 120px,190px 165px;background-position:20px 40px,90px 20px;opacity:.14;animation:starTwinkle 2.2s ease-in-out infinite alternate}
.standard-stage-9 .fx-a{right:250px;top:70px;width:4px;height:520px;background:linear-gradient(to bottom,rgba(255,163,103,.38),transparent);transform:rotate(28deg);transform-origin:top;filter:blur(1px);animation:telescopeBeam 4.8s ease-in-out infinite alternate}

/* 10 제로 룸: 붉은 코어 경고 */
.standard-stage-10{--stdGlow:#ff496a}

.chain-current .device-cover.film::after{transform:translateY(140px);opacity:0}
.device-cover.engine{background:linear-gradient(145deg,#252a2d,#111518);border:4px ridge #3a4246}

.chain-current .device-cover.engine::after{transform:translateY(120px);opacity:0}

.device-cover.mirror::after{inset:0;background:linear-gradient(60deg,transparent 48%,rgba(30,38,45,.65) 49% 51%,transparent 52%),linear-gradient(-60deg,transparent 48%,rgba(30,38,45,.5) 49% 51%,transparent 52%)}
.chain-current .device-cover.mirror::before{transform:translateX(78%)}
.chain-current .device-cover.mirror::after{transform:scale(1.8);opacity:0}

.chain-current .device-cover.core::after{transform:scale(.15);opacity:0}
.chain-stage-11{--chainGlow:#ffc46b}
.chain-stage-12{--chainGlow:#ff536c}

.bottom-hud{position:fixed;z-index:50;left:0;right:0;bottom:0;padding:8px 12px calc(10px + env(safe-area-inset-bottom));display:flex;gap:8px;align-items:center;background:linear-gradient(to top,rgba(4,7,10,.97),rgba(4,7,10,.65),transparent)}.swipe-tip{flex:1;min-width:0;font-size:11px;color:#d2d8de;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.hint-btn{flex:none;border:1px solid rgba(255,255,255,.15);border-radius:12px;background:#151d27;color:white;padding:10px 12px;font-weight:800}.hint-btn span{font-size:10px;color:#ffbd75;margin-left:4px}

<body>
  <div id="app">
    <section id="startScreen" class="screen start-screen">
      <div class="start-card">
        <div class="eyebrow">K-ESCAPE / MOBILE</div>
        <h1>시간의 방</h1>
        <p>15개의 방. 방마다 독립 제한시간. 네 개의 단서를 조합해 4자리 숫자를 찾아 탈출하세요.</p>
        <div class="start-rules">
          <span>↔ 화면을 좌우로 끌어 탐색</span>
          <span>◈ 단서 4개를 조합</span>
          <span>⛓ 11~15번 방은 연쇄형 단서</span>
          <span>⌛ 마지막 60초 긴장음</span>
        </div>
        <button id="startBtn" class="primary-btn">게임 시작</button>
        <small>첫 터치로 모바일 브라우저의 사운드 재생 권한을 활성화합니다.</small>
      </div>
    </section>

    <section id="gameScreen" class="screen game-screen hidden">
      <header class="hud">
        <div class="stage-pill"><span id="stageNo">ROOM 01</span><b id="stageName">기억의 서재</b></div>
        <div id="timer" class="timer" aria-live="polite">07:00</div>
        <button id="memoBtn" class="icon-btn" aria-label="메모 열기">✎</button>
      </header>

      <div class="progress" id="progress"></div>

      <main id="viewport" class="viewport" aria-label="좌우로 움직일 수 있는 방">
        <div id="room" class="room"></div>
      </main>

      <div class="bottom-hud">
        <div class="swipe-tip">◀ 좌우로 드래그해 방 전체를 조사하세요 ▶</div>
        <button id="hintBtn" class="hint-btn">힌트 <span id="hintCost">−30초</span></button>
      </div>
    </section>
  </div>

  <dialog id="clueDialog" class="modal">
    <button class="close-btn" data-close>×</button>
    <div id="clueDetail"></div>
  </dialog>

  <dialog id="keypadDialog" class="modal keypad-modal">
    <button class="close-btn" data-close>×</button>
    <div class="keypad-head">
      <div class="door-mark">EXIT / 4 DIGITS</div>
      <div id="codeDisplay" class="code-display">····</div>
      <div id="codeMessage" class="code-message">네 자리 암호를 입력하세요</div>
    </div>
    <div id="keypad" class="keypad"></div>
  </dialog>

  <dialog id="memoDialog" class="modal memo-modal">
    <button class="close-btn" data-close>×</button>

    <textarea id="memo" placeholder="눈에 띈 규칙이나 숫자를 적어두세요."></textarea>
  </dialog>

  <dialog id="resultDialog" class="modal result-modal">
    <div id="resultContent"></div>

function createAudio(){
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume();
}
function tone(freq=440,dur=.08,vol=.03,type='sine'){
  if(!audioCtx) return;
  const o=audioCtx.createOscillator(), g=audioCtx.createGain();
  o.type=type;o.frequency.value=freq;g.gain.value=vol;o.connect(g);g.connect(audioCtx.destination);
  const t=audioCtx.currentTime;o.start(t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.stop(t+dur);
}
function tensionPulse(){
  if(!gameActive || remaining>60 || remaining<=0 || lastTensionSecond===remaining) return;
  lastTensionSecond=remaining;
  let cadence = remaining<=10 ? 1 : remaining<=30 ? 2 : 4;
  if(remaining%cadence===0){
    tone(remaining<=10?760:remaining<=30?620:480,.08,remaining<=10?.065:.035,'square');
    setTimeout(()=>tone(remaining<=10?920:680,.055,remaining<=10?.05:.025,'sine'),95);
  }
}
function formatTime(s){const m=Math.floor(s/60), sec=Math.max(0,s%60);return `${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`}
function updateTimer(){
  timerEl.textContent=formatTime(remaining);
  timerEl.classList.toggle('warning',remaining<=60&&remaining>30);
  timerEl.classList.toggle('danger',remaining<=30);
  tensionPulse();
}
function startRoomTimer(){
  clearInterval(timerId);
  remaining=ROOM_DATA[stageIndex].minutes*60;

}
function penalty(seconds, label=`−${seconds}초`){

  gameScreen.classList.remove('flash-red');void gameScreen.offsetWidth;gameScreen.classList.add('flash-red');
  tone(150,.18,.055,'sawtooth');
}

function updateChainLocks(){
  if(!isChainStage()) return;
  const buttons=[...roomEl.querySelectorAll('.clue')];

    b.classList.toggle('chain-solved',solved);

  roomEl.classList.remove('chain-progress-0','chain-progress-1','chain-progress-2','chain-progress-3','chain-progress-4');
  roomEl.classList.add(`chain-progress-${Math.min(chainProgress,4)}`);

  if(exit){

    exit.classList.toggle('chain-locked',!ready);

function submitChainAnswer(i){
  if(!isChainStage() || i!==chainProgress) return;
  const input=$('#chainAnswer'), msg=$('#chainMessage');
  if(!input || !msg) return;
  const value=input.value.replace(/\D/g,'').slice(0,1);
  if(!value){msg.textContent='한 자리 숫자를 입력하세요.';return}
  const correct=ROOM_DATA[stageIndex].answer[i];
  if(value!==correct){
    msg.textContent='장치가 반응하지 않습니다. −10초';
    input.value='';input.focus();penalty(10);return;
  }
  chainProgress=i+1;
  msg.textContent=chainProgress<4?`해제 성공. 방 안의 다음 장치가 열립니다.`:'마지막 장치 해제. 출구 시스템에 전원이 들어옵니다.';
  tone(680,.08,.045);setTimeout(()=>tone(900,.1,.035),90);
  updateChainLocks();

// Drag-to-pan: the room remains wider than the phone screen; it is never scaled down.
let drag=false,startX=0,startScroll=0;
viewport.addEventListener('pointerdown',e=>{if(e.target.closest('button'))return;drag=true;startX=e.clientX;startScroll=viewport.scrollLeft;viewport.classList.add('dragging');viewport.setPointerCapture(e.pointerId)});
viewport.addEventListener('pointermove',e=>{if(!drag)return;viewport.scrollLeft=startScroll-(e.clientX-startX)});
viewport.addEventListener('pointerup',()=>{drag=false;viewport.classList.remove('dragging')});viewport.addEventListener('pointercancel',()=>{drag=false;viewport.classList.remove('dragging')});

window.addEventListener('keydown',e=>{if(keypadDialog.open && /[0-9]/.test(e.key))keyPress(e.key);if(keypadDialog.open&&e.key==='Enter')keyPress('↵');if(keypadDialog.open&&e.key==='Backspace')keyPress('C')});



  </script>
